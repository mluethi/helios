---
# Einstiegspunkt fuer ansible-pull.
#
#   ansible-pull -U https://github.com/mluethi/helios.git bootstrap.yml -K
#
# -K fragt nach dem sudo-Passwort. Die Podman-Aufgaben laufen bewusst ohne
# sudo: die Container sind rootless und gehoeren dem Benutzer.

- name: HELIOS einrichten (Welle 1)
  hosts: localhost
  connection: local
  gather_facts: true

  pre_tasks:
    - name: Sicherstellen, dass das Playbook nicht als root laeuft
      ansible.builtin.assert:
        that:
          - ansible_user_id != 'root'
        fail_msg: >-
          Dieses Playbook als normaler Benutzer starten, nicht als root -
          die Container laufen rootless und gehoeren diesem Benutzer.
          Einzelne Aufgaben holen sich sudo selbst.

  roles:
    - basis
    - caddy
    - cli_tools
