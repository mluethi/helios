[defaults]
inventory = inventory.yml
roles_path = roles
# Ohne Galaxy-Collections: nur Module und Plugins aus ansible-core.
# Deshalb NICHT "stdout_callback = yaml": diesen Kurznamen leitet
# ansible-core auf community.general.yaml um, und die Collection bringt
# "dnf install ansible-core" nicht mit. Dieselbe YAML-Ausgabe liefert der
# Standard-Callback seit ansible-core 2.13 mit dieser Einstellung:
callback_result_format = yaml
callback_format_pretty = true
