[defaults]
inventory = inventory.yml
roles_path = roles
# Ohne Galaxy-Collections: nur Module und Plugins aus ansible-core.
# Deshalb NICHT "stdout_callback = yaml": diesen Kurznamen leitet
# ansible-core auf community.general.yaml um, und die Collection bringt
# "dnf install ansible-core" nicht mit. Dieselbe YAML-Ausgabe liefert der
# Standard-Callback seit ansible-core 2.13 mit dieser Einstellung:
callback_result_format = yaml
callback_format_pretty = true

# Das Vault-Passwort liegt ausserhalb des Repos, im Home des Benutzers, mit
# Rechten 0600.
#
# Die Begruendung ist wichtiger als die Einstellung: ansible-vault schuetzt
# DIESES OEFFENTLICHE REPO, nicht die Maschine. Die entschluesselten Werte
# landen auf HELIOS ohnehin im Klartext - in Umgebungsvariablen und
# Konfigurationsdateien der Container. Die Passwortdatei gibt also nichts preis,
# was dort nicht schon steht, und erspart eine zweite Eingabe bei jedem Lauf.
#
# ACHTUNG: Fehlt die Datei, bricht jeder ansible-pull ab. Sie gehoert angelegt,
# BEVOR diese Zeile wirksam wird.
#
# Und das Passwort gehoert nicht nur hierhin: Zum Verschluesseln neuer Werte
# wird es auch auf dem Mac gebraucht, und geht HELIOS verloren, waeren ohne
# Kopie alle verschluesselten Werte im Repo unlesbar. Aufbewahrung im
# Passwortspeicher.
vault_password_file = ~/.vault_pass
