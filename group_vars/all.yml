---
# Grundwerte fuer HELIOS. Keine Geheimnisse - dieses Repo ist oeffentlich.

helios_benutzer: marcello
helios_hostname: helios.rubi

# Interne Namen. Jeder braucht einen Host-Override im Unbound der OPNsense,
# alle auf dieselbe IP.
helios_dienste_namen:
  cockpit: helios.rubi
  homepage: home.rubi
  # Welle 2, Host-Overrides am 19.09.2026 angelegt, Dienste noch nicht gebaut:
  forgejo: forgejo.rubi
  vaultwarden: vault.rubi

# Container-Images, exakt festgenagelt. Ein Neuaufbau soll dieselbe Maschine
# ergeben und nicht nur eine aehnliche - darum geht es in Durchgang 2.
#
# "latest" heisst NICHT "immer aktuell", sondern "unbekannt": Ein Quadlet zieht
# das Image nicht von selbst neu, ohne AutoUpdate laeuft weiter, was beim ersten
# Mal geholt wurde. Der Tag sagt also nur, was der naechste Pull bringt.
#
# ACHTUNG beim Heben: Die Schreibweise der Tags ist nicht einheitlich. Caddy
# schreibt "2.11.4", Homepage "v2.4.0" - mit v. Am 19.09.2026 gegen beide
# Registries geprueft. Die dauerhafte Regel ist offen (F-59 im Homelab-Repo).
helios_images:
  caddy: docker.io/library/caddy:2.11.4
  homepage: ghcr.io/gethomepage/homepage:v2.4.0

# Podman-Netzwerk, ueber das sich die Container spaeter beim Namen finden.
helios_netzwerk: helios

# Port, ab dem rootless Container lauschen duerfen. Caddy braucht 80.
helios_port_start: 80

# --- Sicherung ---------------------------------------------------------------
#
# Ziel ist vorerst die zweite Platte im Geraet selbst. Das ist KEIN richtiges
# Backup - gegen Diebstahl, Feuer oder ein sterbendes Netzteil hilft es nicht.
# Es ist das Ziel, an dem die Mechanik entsteht und der Rueckholtest geprobt
# wird. Kommt eine externe Platte, aendert sich genau eine dieser Zeilen.
#
# UUID statt /dev/sda1: Geraetenamen koennen wandern, die UUID nicht.
helios_backup_platte_uuid: 6aacdd60-be82-4d87-bbc7-40aed5e7327b
helios_backup_einhaengepunkt: /data
# Das Verzeichnis ueber dem Repository.
helios_restic_verzeichnis: /data/restic
helios_restic_repo: "{{ helios_restic_verzeichnis }}/helios"

# --- Geheimnisse -------------------------------------------------------------
#
# Verschluesselt mit ansible-vault. Das Passwort dazu liegt in ~/.vault_pass
# (Rechte 0600) und zusaetzlich im Passwortspeicher - ohne Kopie ausserhalb von
# HELIOS waeren diese Werte verloren, wenn die Maschine es ist.
#
# Einzelne Werte statt ganzer Dateien: So bleibt sichtbar, WELCHE Geheimnisse es
# gibt und wie sie heissen - nur die Werte sind Chiffre, und die Git-Historie
# bleibt lesbar.
#
# Neuen Wert anlegen:
#   p=$(openssl rand -base64 32)
#   printf '%s' "$p" | ansible-vault encrypt_string --stdin-name 'name'
#   unset p
# printf '%s' ohne \n ist Absicht: encrypt_string verschluesselt exakt, was
# ankommt - EINSCHLIESSLICH eines Zeilenumbruchs. Die Passwortdatei wird von
# Ansible bereinigt, die Eingabe hier nicht. Dieselbe Sorte Wert, zwei Regeln.

# Passwort des restic-Repositories. Angelegt am 19.09.2026, bevor es ein
# Repository gibt: Es muss existieren, bevor eines angelegt wird, und gehoert
# ohnehin in den Passwortspeicher. Geht es verloren, sind alle Sicherungen
# unlesbar - dasselbe gilt fuer Backups wie fuer die Zertifizierungsstelle.
restic_passwort: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          62383635373866323764653765623965306266326636653932613537326532623863616530633266
          6366333132326366396462316263366532623434613265640a396634396631666438303935383038
          63643536306634343163343636643536626234383861323636633037313564376137366337383233
          6361386538353662320a366539613731663433653031313539333437656131333634366262633331
          33313936386661386563623138313232393566343063376636663935393365643161393031376137
          6635353266373765333031336335613966626334356666616562
