---
# Backrest: Weboberflaeche zum Hineinschauen in die restic-Sicherungen.
# Siehe den Kommentar im Quadlet - Fenster, kein Werkzeug.

- name: Backrest als Quadlet
  ansible.builtin.template:
    src: backrest.container.j2
    dest: "~/.config/containers/systemd/backrest.container"
    mode: "0644"
  notify:
    - systemd neu einlesen
    - Backrest neu starten

- name: Handler jetzt ausfuehren
  ansible.builtin.meta: flush_handlers

- name: Backrest starten
  ansible.builtin.systemd_service:
    name: backrest
    scope: user
    state: started
