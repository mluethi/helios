---
# System-Grundlagen. Braucht root - deshalb ueberall "become".

- name: Pakete installieren
  become: true
  ansible.builtin.dnf:
    name:
      - podman
      - cockpit
      - cockpit-podman
      - git-core
      - policycoreutils-python-utils   # semanage, fuer SELinux-Probleme
      - tmux
      # Performance Co-Pilot. pmcd sammelt Systemkennzahlen, pmlogger schreibt
      # sie in lokale Archive - daraus zeichnet Cockpit "Metriken und Verlauf".
      # Ohne PCP zeigt Cockpit nur Momentanwerte, keinen Verlauf.
      #
      # Auf Fedora 44 gibt es KEIN Paket "cockpit-pcp" - das nennen nur aeltere
      # Anleitungen. Am 19.09.2026 gegen Fedoras mdapi geprueft, und ein
      # falscher Name laesst dnf die ganze Liste abbrechen.
      - pcp
      - pcp-zeroconf                   # dichtere Messfolge, fertige Konfigs
    state: present

- name: Cockpit aktivieren
  become: true
  ansible.builtin.systemd_service:
    name: cockpit.socket
    enabled: true
    state: started

# Rootless-Container duerfen standardmaessig keine Ports unter 1024 belegen.
# Caddy braucht 80 und 443. Ohne diese Datei startet Caddy nicht - und die
# Fehlermeldung nennt den Grund nicht.
- name: Privilegierte Ports fuer rootless freigeben
  become: true
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-rootless-ports.conf
    content: "net.ipv4.ip_unprivileged_port_start={{ helios_port_start }}\n"
    owner: root
    group: root
    mode: "0644"
  register: sysctl_datei

- name: sysctl neu einlesen
  become: true
  ansible.builtin.command:
    cmd: sysctl --system
  when: sysctl_datei.changed
  changed_when: true

# Ohne linger beendet systemd alle Container des Benutzers, sobald die
# SSH-Sitzung endet.
- name: Dienste des Benutzers ohne Anmeldung laufen lassen
  become: true
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ helios_benutzer }}"
    creates: "/var/lib/systemd/linger/{{ helios_benutzer }}"

# Cockpit prueft die Herkunft der Anfrage und weist den Reverse Proxy sonst ab.
# Die Fehlermeldung klingt nicht nach ihrer Ursache.
#
# AllowUnencrypted ist am 18.09.2026 dazugekommen, nach einer
# Umleitungsschleife: Cockpit horcht auf 9090 auf HTTP UND HTTPS und leitet
# jede HTTP-Verbindung auf HTTPS um - ausser sie kommt von localhost. Caddy
# spricht aber einfaches HTTP zu host.containers.internal, und das ist aus dem
# Container heraus nicht localhost. Also: Cockpit leitet um, Caddy reicht die
# Umleitung nach aussen, der Browser kommt zurueck - endlos.
# ProtocolHeader allein genuegt dagegen nicht, nachgemessen am Geraet.
#
# Preis: Die Strecke Caddy -> Cockpit laeuft unverschluesselt. Sie fuehrt vom
# Container zum Host ueber das Podman-Netz, nicht uebers LAN; nach aussen macht
# Caddy TLS. Offen bleibt, dass Port 9090 im ganzen LAN erreichbar ist - siehe
# das Erkenntnis-Journal im Homelab-Repo.
- name: Cockpit hinter dem Reverse Proxy erlauben
  become: true
  ansible.builtin.copy:
    dest: /etc/cockpit/cockpit.conf
    content: |
      [WebService]
      Origins = https://{{ helios_hostname }} https://{{ helios_hostname }}:443
      ProtocolHeader = X-Forwarded-Proto
      AllowUnencrypted = true
    owner: root
    group: root
    mode: "0644"
  notify: Cockpit neu starten

# Fedora Server bringt firewalld mit, und dessen Standardzone laesst nur ssh,
# cockpit und dhcpv6-client durch. Caddy horcht zwar auf 80 und 443, aber von
# aussen kommt nichts an - auf der Maschine selbst laeuft der Verkehr ueber die
# Loopback-Schnittstelle und wird nicht gefiltert. Deshalb funktionierte curl
# auf HELIOS und der Browser vom Mac nicht (18.09.2026).
#
# ansible.posix.firewalld waere das passende Modul, steckt aber in einer
# Galaxy-Collection - siehe ansible.cfg. Also firewall-cmd von Hand, idempotent
# ueber die Abfrage davor.
- name: Freigegebene Dienste der Firewall abfragen
  become: true
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --list-services
  changed_when: false
  register: firewall_dienste

- name: HTTP und HTTPS in der Firewall freigeben
  become: true
  ansible.builtin.command:
    cmd: "firewall-cmd --permanent --add-service={{ item }}"
  loop:
    - http
    - https
  when: item not in firewall_dienste.stdout.split()
  changed_when: true
  notify: Firewall neu laden

# Cockpit schreibt eine Zeile in die Anmeldemeldung, die auf
#   "Web console: https://helios:9090/ or https://192.168.1.20:9090/"
# verweist. Seit die direkte Freigabe von 9090 zurueckgenommen ist, ist keine
# der beiden Adressen aus dem LAN erreichbar - die Meldung schickt also in die
# Irre. /etc/motd.d/cockpit ist ein Symlink nach /run/cockpit/motd; die Datei
# unter /run ist fluechtig und wird neu geschrieben, der Symlink im /etc ist
# der richtige Hebel.
- name: Irrefuehrende Cockpit-Zeile aus der Anmeldemeldung entfernen
  become: true
  ansible.builtin.file:
    path: /etc/motd.d/cockpit
    state: absent

# Eine Anmeldemeldung, die den Weg nennt, der wirklich funktioniert. Loeschen
# allein waere die halbe Loesung - die Zeile hatte ja einen Zweck.
- name: Anmeldemeldung mit dem richtigen Weg zu Cockpit
  become: true
  ansible.builtin.copy:
    dest: /etc/motd.d/helios
    content: "Cockpit: https://{{ helios_dienste_namen.cockpit }}/\n"
    owner: root
    group: root
    mode: "0644"

# Fedora Server gibt Cockpit von sich aus im ganzen LAN frei (Port 9090). Seit
# AllowUnencrypted leitet Cockpit dort nicht mehr auf HTTPS um - wer
# http://helios.rubi:9090 aufruft, schickt sein Passwort im Klartext. Der Weg
# ueber Caddy (https://helios.rubi) ist erprobt, also faellt die direkte
# Freigabe weg.
#
# Caddy trifft das nicht: Es waehlt im Container host.containers.internal
# (169.254.1.2), und pasta baut daraus auf dem Host eine Verbindung
# 192.168.1.20 -> 192.168.1.20:9090 auf. Maschine zu sich selbst, also ueber
# Loopback - und Loopback wird nicht gefiltert. Am 19.09.2026 gemessen und
# nach der Aenderung nachgeprueft: Caddy 200, Port 9090 von aussen abgelehnt.
#
# ACHTUNG: Cockpit horcht weiterhin auf *:9090. Der Schutz ist allein die
# Firewall - und die haengt an der Zone, die Zone an der Schnittstelle.
- name: Direkte Freigabe von Cockpit zuruecknehmen
  become: true
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --remove-service=cockpit
  when: "'cockpit' in firewall_dienste.stdout.split()"
  changed_when: true
  notify: Firewall neu laden

# pmproxy stellt die Kennzahlen ueber eine REST-Schnittstelle auf Port 44322
# bereit; Cockpit liest sie von dort. Bewusst NICHT in der Firewall
# freigegeben - gebraucht wird sie nur lokal.
- name: Dienste des Performance Co-Pilot aktivieren
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - pmcd
    - pmlogger
    - pmproxy

# Der Socket wird von Arcane gebraucht (Welle 2) und schadet vorher nicht.
- name: Podman-Socket des Benutzers aktivieren
  ansible.builtin.systemd_service:
    name: podman.socket
    scope: user
    enabled: true
    state: started
