---
# Werkzeuge fuer die Kommandozeile. Eigene Rolle, damit sie spaeter auf jeder
# Maschine ausgerollt werden kann.
#
# chezmoi steht hier anstelle von yadm: Das Paket yadm gibt es in Fedora nicht -
# weder in 44 noch ueberhaupt (packages.fedoraproject.org antwortet mit 404).
# chezmoi loest dieselbe Aufgabe, die Dotfiles-Verwaltung, und ist in Fedora 44
# vorhanden. Entschieden am 18.09.2026.
#
# Merksatz aus dem Vorfall: dnf bricht bei EINEM unbekannten Paket ab und nimmt
# die ganze Liste mit - ein falscher Name verhindert alle. Jeden Namen gegen die
# Paketquellen pruefen, bevor er hier landet; die urspruengliche Liste stammte
# aus einem Video und war nie geprueft.

- name: CLI-Werkzeuge installieren
  become: true
  ansible.builtin.dnf:
    name:
      - mc
      - bat
      - fzf
      - zoxide
      - chezmoi
      - direnv
    state: present
