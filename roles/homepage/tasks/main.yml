---
# Homepage: die Startseite, von der aus die Dienste erreichbar sind.
#
# Erster Dienst der Welle 2, und bewusst dieser: Homepage haelt keine Daten,
# die verloren gehen koennen - nur ihre eigene Konfiguration. Damit ist die
# Regel aus Schritt 7 nicht verletzt ("Backup, bevor Daten da sind"), und das
# Muster fuer einen zweiten Dienst hinter Caddy ist trotzdem bewiesen.

- name: Verzeichnis fuer die Homepage-Konfiguration anlegen
  ansible.builtin.file:
    path: "~/homepage"
    state: directory
    mode: "0755"

- name: Homepage als Quadlet
  ansible.builtin.template:
    src: homepage.container.j2
    dest: "~/.config/containers/systemd/homepage.container"
    mode: "0644"
  notify:
    - systemd neu einlesen
    - Homepage neu starten

- name: Handler jetzt ausfuehren
  ansible.builtin.meta: flush_handlers

- name: Homepage starten
  ansible.builtin.systemd_service:
    name: homepage
    scope: user
    state: started
